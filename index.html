<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4faf2">
  <title>Who We Are and How We Got Here</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4faf2;
      --surface: #fff;
      --ink: #1d3a26;
      --muted: #58705e;
      --border: #cfe3d1;
      --accent: #16833c;
      --shadow: 0 12px 32px rgb(29 58 38 / 8%);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10231a;
        --surface: #173127;
        --ink: #e4f2e6;
        --muted: #b3cbb8;
        --border: #355a42;
        --accent: #83d69a;
        --shadow: 0 12px 32px rgb(0 0 0 / 20%);
      }
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }
    .shell { width: min(100% - 40px, 1080px); margin: 0 auto; }
    header { padding: clamp(64px, 13vh, 132px) 0 42px; }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 760px;
      margin: 0;
      font: 400 clamp(38px, 7vw, 72px)/1.04 Georgia, "Times New Roman", serif;
      letter-spacing: -.035em;
    }
    header p:last-child {
      max-width: 620px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.65;
    }
    main { padding-bottom: 72px; }
    .section-heading {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      margin: 0 0 16px;
    }
    h2 { margin: 0; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
    #page-count { color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr)); gap: 16px; }
    .card {
      position: relative;
      display: flex;
      min-height: 210px;
      flex-direction: column;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 16px 38px rgb(29 58 38 / 14%);
    }
    .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .card h3 {
      margin: 0 32px 10px 0;
      font: 400 25px/1.2 Georgia, "Times New Roman", serif;
    }
    .card p { margin: 0; color: var(--muted); line-height: 1.6; }
    .arrow { position: absolute; top: 22px; right: 22px; color: var(--accent); font-size: 22px; }
    footer { padding: 0 0 28px; color: var(--muted); font-size: 12px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="shell">
    <p class="eyebrow">An interactive reader’s guide</p>
    <h1>Who We Are and How We Got Here</h1>
    <p>Explore the stories, migrations, and ideas that shaped our shared human history. Choose a page to begin.</p>
  </header>
  <main class="shell">
    <div class="section-heading">
      <h2>Explore</h2>
      <span id="page-count" aria-live="polite"></span>
    </div>
    <nav class="grid" id="pages" aria-label="Explore pages"></nav>
  </main>
  <footer class="shell">Choose a story above to explore.</footer>
  <script>
    // Add a page by providing its relative HTML filepath, title, and description.
    const pages = [
      {
        path: "30 Population Mixtures – Interactive Map + Reader.html",
        title: "30 Population Mixtures",
        description: "Explore thirty major population-mixture events on an interactive world map and open the related passages from the book."
      },
      {
        path: "reich_academic_genealogy.html",
        title: "Academic Genealogy",
        description: "Trace the people, ideas, and technologies that shaped David Reich’s ancient-DNA work."
      }
    ];

    const pageList = document.querySelector("#pages");
    for (const page of pages) {
      const link = document.createElement("a");
      link.className = "card";
      link.href = page.path;

      const title = document.createElement("h3");
      title.textContent = page.title;
      const description = document.createElement("p");
      description.textContent = page.description;
      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.setAttribute("aria-hidden", "true");
      arrow.textContent = "↗";

      link.append(title, description, arrow);
      pageList.append(link);
    }
    document.querySelector("#page-count").textContent =
      `${pages.length} ${pages.length === 1 ? "page" : "pages"}`;
  </script>
</body>
</html>
